name: Test Termux Agent

on:
  push:
    branches:
      - feature/termux-agent-mvp
    paths:
      - "termux-agent/**"
      - ".github/workflows/test-termux-agent.yml"
  pull_request:
    paths:
      - "termux-agent/**"
      - ".github/workflows/test-termux-agent.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: termux-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
