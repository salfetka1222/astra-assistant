name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: "Build a signed APK artifact without publishing a release"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Publish signed release (requires signing secrets and approval)"
        type: boolean
        required: true
        default: false
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

concurrency:
  group: astra-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Release builds are manual and must never fall back to a debug signature.
      - name: Verify release signing configuration
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed || inputs.publish_release)
        env:
          KEYSTORE: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/astra-release.jks"
          chmod 600 "$RUNNER_TEMP/astra-release.jks"

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed || inputs.publish_release)
        env:
          ASTRA_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/astra-release.jks
          ASTRA_SIGNING_STORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_SIGNING_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_SIGNING_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Generate release checksum
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed || inputs.publish_release)
        run: |
          cd android/app/build/outputs/apk/release
          test -f app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload signed APK artifact
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed || inputs.publish_release)
        uses: actions/upload-artifact@v4
        with:
          name: astra-signed-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/astra-release.jks"

      - name: Validate release branch and unused tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/in-app-updates" || { echo "Unexpected release branch: $GITHUB_REF"; exit 1; }
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/astra-tag-response.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/astra-v5") || exit 1
          if [ "$status" = 404 ]; then
            echo "Tag astra-v5 is available"
          else
            echo "Refusing publication: tag lookup returned HTTP $status"
            exit 1
          fi

      - name: Publish signed APK and checksum
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: astra-v5
          name: Astra 0.5.0
          prerelease: false
          draft: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
