name: Termux Agent Tests

on:
  push:
    paths:
      - "termux-agent/**"
      - ".github/workflows/termux-tests.yml"
  pull_request:
    paths:
      - "termux-agent/**"
      - ".github/workflows/termux-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: termux-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
